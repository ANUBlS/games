<!DOCTYPE html>
<html lang="en" data-era="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Furrows of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alfa+Slab+One&family=Archivo:wght@400;600&family=Archivo+Black&family=Audiowide&family=Cinzel:wght@700&family=IM+Fell+English+SC&family=Michroma&family=Orbitron:wght@600;800&family=Oxanium:wght@400;600&family=Pirata+One&family=Sora:wght@700&family=Special+Elite&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
/* Layout: the 3D field fills the screen. A thin HUD floats over it: purse, age progress and
   shop along the top, a map of the whole field top right, walk and work controls at the
   bottom. The shop is a bottom sheet. The HUD takes a new palette and typeface in each of
   the twelve ages, from Roman capitals in 300 to a star-age console in 3000. */
:root{
  --bg:#ece3d0; --panel:#f7f1e3; --ink:#2b211a; --muted:#6f6052; --line:#c2b193;
  --accent:#8f2d25; --on-accent:#fbf3e4;
  --gold:#d4a017; --gold-edge:#8a6408;
  --radius:2px;
  --font-display:"Cinzel","Trajan Pro",serif;
  --font-body:"Alegreya Sans","Trebuchet MS",sans-serif;
  --display-size:1.35rem;
  color-scheme:light;
}
:root[data-era="2"]{
  --bg:#e3dcc0; --panel:#f0ead0; --ink:#26301f; --muted:#5d6650; --line:#b3ad85;
  --accent:#2f5d3a; --on-accent:#f3efd8; --radius:8px;
  --font-display:"Uncial Antiqua","Luminari",fantasy,serif; --display-size:1.25rem;
}
:root[data-era="3"]{
  --bg:#e6d7b5; --panel:#f3e8cb; --ink:#2a1f14; --muted:#6d5a41; --line:#b9a273;
  --accent:#263f86; --on-accent:#f6ecd2; --gold:#d9a520; --gold-edge:#8c6410; --radius:3px;
  --font-display:"Pirata One","Luminari",fantasy,serif; --display-size:1.6rem;
}
:root[data-era="4"]{
  --bg:#d9e3dc; --panel:#eef3ec; --ink:#18303a; --muted:#55707a; --line:#9db3ae;
  --accent:#0d6a6a; --on-accent:#eef7f3; --gold:#c9992b; --gold-edge:#7d5d12; --radius:6px;
  --font-display:"IM Fell English SC","Baskerville",serif; --display-size:1.35rem;
}
:root[data-era="5"]{
  --bg:#262220; --panel:#332d2a; --ink:#f1e7d8; --muted:#b3a594; --line:#57493f;
  --accent:#e07a2c; --on-accent:#1d1512; --gold:#d3a743; --gold-edge:#7c5d17; --radius:2px;
  --font-display:"Alfa Slab One","Rockwell",serif; --display-size:1.25rem;
  color-scheme:dark;
}
:root[data-era="6"]{
  --bg:#d8d3bd; --panel:#e8e4d0; --ink:#23261c; --muted:#5c5f4d; --line:#a3a184;
  --accent:#4b5a2a; --on-accent:#eef0dc; --gold:#c9a227; --gold-edge:#7a5f10; --radius:1px;
  --font-display:"Special Elite","Courier New",monospace; --display-size:1.25rem;
}
:root[data-era="7"]{
  --bg:#eef2e6; --panel:#ffffff; --ink:#14241a; --muted:#5b6b5f; --line:#cfd8c6;
  --accent:#1f7a34; --on-accent:#ffffff; --gold:#f2c230; --gold-edge:#a97f0c; --radius:10px;
  --font-display:"Archivo Black","Arial Black",sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif; --display-size:1.2rem;
}
:root[data-era="8"]{
  --bg:#dfe7f5; --panel:#f4f7fd; --ink:#101a3a; --muted:#54608a; --line:#b4c0e0;
  --accent:#2a4bd7; --on-accent:#ffffff; --gold:#f2c230; --gold-edge:#a97f0c; --radius:16px;
  --font-display:"Audiowide","Arial Black",sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif; --display-size:1.1rem;
}
:root[data-era="9"]{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#1a1a1a; --muted:#666159; --line:#d9d3c6;
  --accent:#0f7b6c; --on-accent:#ffffff; --gold:#f2b430; --gold-edge:#a2750a; --radius:12px;
  --font-display:"Sora","Helvetica Neue",sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif; --display-size:1.15rem;
}
:root[data-era="10"]{
  --bg:#2a1a12; --panel:#3a261a; --ink:#ffe9d2; --muted:#c7a98c; --line:#5c4030;
  --accent:#ff8a3c; --on-accent:#2a1206; --gold:#ffc94a; --gold-edge:#9a6a10; --radius:6px;
  --font-display:"Oxanium","Segoe UI",sans-serif;
  --font-body:"Oxanium","Segoe UI",sans-serif; --display-size:1.2rem;
  color-scheme:dark;
}
:root[data-era="11"]{
  --bg:#090e1f; --panel:#121a36; --ink:#e0f7ff; --muted:#8fa6c9; --line:#2a3763;
  --accent:#3ee6c8; --on-accent:#04211d; --gold:#ffd45e; --gold-edge:#a8801c; --radius:14px;
  --font-display:"Orbitron","Eurostile",sans-serif;
  --font-body:"Oxanium","Segoe UI",sans-serif; --display-size:1.1rem;
  color-scheme:dark;
}
:root[data-era="12"]{
  --bg:#05060f; --panel:#0e1024; --ink:#f2efff; --muted:#9d98c9; --line:#2b2a55;
  --accent:#c06bff; --on-accent:#14052a; --gold:#ffe27a; --gold-edge:#a8881c; --radius:0px;
  --font-display:"Michroma","Eurostile",sans-serif;
  --font-body:"Oxanium","Segoe UI",sans-serif; --display-size:1rem;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.35; -webkit-text-size-adjust:100%; user-select:none; -webkit-user-select:none}
button{font:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
svg{display:block}
[hidden]{display:none !important}

#view{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; background:var(--bg)}
.hud{position:fixed; inset:0; pointer-events:none}
.hud > *{pointer-events:auto}

.panel{background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius)}
.top{position:absolute; left:10px; right:10px; top:10px; display:flex; align-items:stretch; gap:8px; pointer-events:none}
.top > *{pointer-events:auto}
.purse{display:flex; align-items:center; gap:6px; padding:5px 11px 5px 8px; font-weight:700; font-size:1.2rem; font-variant-numeric:tabular-nums; flex:none}
.purse svg{width:20px; height:20px}
.age{flex:1; min-width:0; padding:5px 10px 6px; font-size:.78rem; line-height:1.25}
.age b{font-family:var(--font-display); font-weight:400; font-size:.95rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.age .bar{height:5px; border-radius:3px; background:var(--line); margin:3px 0 2px; overflow:hidden}
.age .bar i{display:block; height:100%; width:calc(100% * var(--fill,0)); background:var(--accent)}
.age span{color:var(--muted); font-variant-numeric:tabular-nums; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.btn{
  border:0; border-radius:var(--radius); background:var(--accent); color:var(--on-accent);
  font-weight:700; padding:9px 13px; min-height:40px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; font-variant-numeric:tabular-nums;
}
.btn svg{width:15px; height:15px}
.btn:disabled{opacity:.45; cursor:default}
.btn.quiet{background:transparent; color:var(--ink); border:1.5px solid var(--line); font-weight:500}
.btn:not(:disabled):active{transform:translateY(1px)}
#shopBtn{flex:none; position:relative}
#shopBtn.ping::after{content:""; position:absolute; top:-4px; right:-4px; width:12px; height:12px; border-radius:50%; background:var(--gold); border:2px solid var(--gold-edge)}

.bagrow{position:absolute; left:10px; top:106px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; max-width:calc(100% - 122px)}
.bag{padding:4px 9px 6px; font-size:.78rem; min-width:150px; font-variant-numeric:tabular-nums}
.bag b{font-weight:700}
.bag .bar{height:6px; border-radius:3px; background:var(--line); margin-top:3px; overflow:hidden}
.bag .bar i{display:block; height:100%; width:calc(100% * var(--fill,0)); background:var(--gold)}
.bag.full{border-color:var(--gold-edge); box-shadow:0 0 0 2px var(--gold)}
.bag.full .bar i{background:#d23a2a}
.barnhint{display:flex; align-items:center; gap:6px; padding:3px 9px; font-size:.78rem; font-variant-numeric:tabular-nums}
.barnhint i{display:block; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:13px solid var(--accent)}
#sell{position:absolute; left:50%; bottom:100px; transform:translateX(-50%); min-height:56px; font-size:1.1rem; padding:10px 20px; background:var(--gold); color:#2a1f14; box-shadow:0 0 0 2px var(--gold-edge)}
.gains span.bagged{background:var(--panel); color:var(--ink); border-color:var(--line); font-size:.9rem}
.gains span.big{font-size:1.4rem; padding:2px 12px}
#enter{position:absolute; left:50%; top:112px; transform:translateX(-50%); box-shadow:0 0 0 3px var(--gold)}
.map{position:absolute; right:10px; top:74px; width:92px; height:92px; padding:3px; overflow:hidden}
.map canvas{width:100%; height:100%; display:block; transform:scaleX(-1); border-radius:calc(var(--radius) / 2)}
.map i{position:absolute; width:0; height:0; margin:-7px 0 0 -5px; border-left:5px solid transparent; border-right:5px solid transparent; border-bottom:12px solid #fff; filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 0 1.5px #000); transform-origin:50% 58%}
#land{position:absolute; left:10px; top:74px; margin:0; padding:3px 9px; font-size:.78rem; font-variant-numeric:tabular-nums; max-width:calc(100% - 122px)}

.gains{position:absolute; left:50%; top:46%; width:0; height:0}
.gains span{
  position:absolute; left:0; top:0; transform:translate(-50%,0); white-space:nowrap; pointer-events:none;
  font-weight:700; font-size:1.05rem; color:#2a1f14; background:var(--gold); border:1.5px solid var(--gold-edge);
  padding:0 8px; border-radius:99px; font-variant-numeric:tabular-nums; animation:rise .8s ease-out forwards;
}
@keyframes rise{to{transform:translate(-50%,-70px); opacity:0}}

.tip{position:absolute; left:50%; top:200px; transform:translateX(-50%); width:min(92%,380px); padding:9px 12px; font-size:.9rem; text-align:center; pointer-events:none}
.tip b{display:block}
.tip span{color:var(--muted); font-size:.82rem}

.joy{position:absolute; width:112px; height:112px; margin:-56px 0 0 -56px; border-radius:50%; border:2px solid rgba(255,255,255,.75); background:rgba(0,0,0,.18); pointer-events:none}
.joy i{position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.joy.rest{left:76px; bottom:20px; top:auto; margin:0 0 0 -56px; opacity:.55}

#work{position:absolute; right:14px; bottom:26px; min-width:112px; min-height:56px; font-size:1.05rem; box-shadow:0 0 0 2px var(--panel)}
#work[aria-pressed="false"]{background:var(--panel); color:var(--ink); box-shadow:0 0 0 1.5px var(--line)}

/* shop sheet */
.shade{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:11; max-height:82%; overflow:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg); border-top:2px solid var(--accent); border-radius:calc(var(--radius) * 2) calc(var(--radius) * 2) 0 0;
  padding:0 16px 24px; user-select:none;
}
.sheet .inner{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.sheet header{position:sticky; top:0; z-index:1; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0 10px; border-bottom:2px solid var(--line)}
.sheet h1{font-family:var(--font-display); font-size:var(--display-size); font-weight:400; line-height:1.05; margin:0}
.sheet h2{font-family:var(--font-display); font-weight:400; font-size:1.1rem; margin:0 0 8px; line-height:1.1}
.next{display:flex; align-items:center; justify-content:space-between; gap:12px}
.next p{margin:0; font-size:.92rem}
.next p span{color:var(--muted); font-variant-numeric:tabular-nums}
.ages{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
.ages li{border:1.5px solid var(--line); border-radius:var(--radius); text-align:center; font-size:.78rem; font-weight:700; padding:3px 0; color:var(--muted); font-variant-numeric:tabular-nums}
.ages li.done{background:var(--line); color:var(--ink)}
.ages li.now{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.seeds{display:flex; flex-wrap:wrap; gap:8px}
.seed{display:flex; align-items:center; gap:8px; text-align:left; cursor:pointer; background:var(--panel); border:2px solid var(--line); border-radius:var(--radius); padding:6px 12px 6px 6px}
.seed svg{width:34px; height:34px; flex:none}
.seed b{display:block; font-size:.95rem; line-height:1.15; color:var(--ink)}
.seed span{font-size:.74rem; color:var(--muted); font-variant-numeric:tabular-nums}
.seed[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.tool{display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 12px; background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:9px 12px}
.tool + .tool{margin-top:8px}
.tool small{font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700; display:block}
.tool b{font-size:1rem; display:block}
.tool p{margin:0; font-size:.82rem; color:var(--muted)}
.tool .btn{min-width:92px}
.sheet footer{display:flex; flex-direction:column; gap:10px; font-size:.82rem; color:var(--muted); border-top:2px solid var(--line); padding-top:12px}
.gfx .btn{min-height:34px; padding:5px 12px}
.gfx .btn[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.sheet footer .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}

/* new age dialog */
.veil{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:20px; background:color-mix(in srgb,var(--bg) 80%,transparent)}
.veil.open{display:flex}
.card{width:100%; max-width:380px; max-height:100%; overflow:auto; background:var(--panel); border:2px solid var(--accent); border-radius:var(--radius); padding:22px 20px 20px; animation:arrive .5s ease-out}
@keyframes arrive{from{transform:translateY(14px); opacity:.2}}
.card .year{font-family:var(--font-display); font-size:3.4rem; line-height:1; font-variant-numeric:tabular-nums}
.card .name{font-family:var(--font-display); font-size:1.2rem; margin:4px 0 10px}
.card p{margin:0 0 12px}
.card ul{margin:0 0 16px; padding-left:18px}
.card li{margin:2px 0}
.card .btn{width:100%}

#fail{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; z-index:30; background:var(--bg)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .gains span{opacity:0}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="logic">
/* Game rules. No DOM and no 3D in here, so the same code can be run and balanced outside the page. */
const Game = (() => {
  const N = 256, WILD = 0, PLOWED = 1, GROWING = 2, RIPE = 3;
  const ERAS = [
    {id:1,  year:300,  name:'Antiquity',      blurb:'Sixty-five thousand plots of grass and your two hands. Plow, sow wheat, reap.'},
    {id:2,  year:800,  name:'Early Medieval', blurb:'An ox and a wooden ard now break the ground for you. Barley feeds the village.'},
    {id:3,  year:1200, name:'High Medieval',  blurb:'The heavy plough turns deep soil, and windmills grind what you bring in.'},
    {id:4,  year:1600, name:'Discovery',      blurb:'Ships come home from the New World carrying strange roots and red fruit.'},
    {id:5,  year:1850, name:'Industrial',     blurb:'Steam reaches the fields. One engine now does the work of forty hands.'},
    {id:6,  year:1940, name:'Machine Age',    blurb:'A petrol tractor replaces the horses, and hybrid corn fills the silos.'},
    {id:7,  year:1990, name:'Agribusiness',   blurb:'A combine takes a whole swath in one pass. Fields run to the horizon.'},
    {id:8,  year:2000, name:'Digital',        blurb:'Satellites steer the tractor to the centimetre. You watch the yield map.'},
    {id:9,  year:2026, name:'Smart Farming',  blurb:'Drones scout, spray and pick. The farm runs from a phone.'},
    {id:10, year:2100, name:'Robot Age',      blurb:'Field robots work through the heat of the day and never stop for water.'},
    {id:11, year:2500, name:'Orbital',        blurb:'A hover harvester drifts over the rows. Moonberries glow at dusk.'},
    {id:12, year:3000, name:'Star Age',       blurb:'A cloud of nanobots tends every plant at once. Starbloom opens under strange skies.'}
  ];
  const CROPS = [
    {id:'wheat',      name:'Wheat',      era:1,  grow:22,  value:3,         color:'#dcc06a', stem:'#c9a84a', h:1},
    {id:'barley',     name:'Barley',     era:2,  grow:26,  value:7,         color:'#efe0a0', stem:'#b9b060', h:.9},
    {id:'cabbage',    name:'Cabbage',    era:3,  grow:30,  value:16,        color:'#8fd6a8', stem:'#4f8a2d', h:.45},
    {id:'potato',     name:'Potato',     era:4,  grow:34,  value:40,        color:'#c3b1e6', stem:'#4f8a2d', h:.6},
    {id:'tomato',     name:'Tomato',     era:4,  grow:48,  value:70,        color:'#d8362a', stem:'#3d7a26', h:.85},
    {id:'cotton',     name:'Cotton',     era:5,  grow:55,  value:300,       color:'#f6f1e4', stem:'#8a6a3e', h:.85},
    {id:'corn',       name:'Corn',       era:6,  grow:50,  value:1200,      color:'#f0b429', stem:'#4f8a2d', h:1.6},
    {id:'sunflower',  name:'Sunflower',  era:7,  grow:70,  value:6000,      color:'#ff9d0a', stem:'#3d7a26', h:1.75},
    {id:'soybean',    name:'Soybean',    era:8,  grow:60,  value:28000,     color:'#a39a3e', stem:'#5a7a2d', h:.7},
    {id:'strawberry', name:'Strawberry', era:9,  grow:75,  value:150000,    color:'#ff4f6d', stem:'#3d7a26', h:.4},
    {id:'glowrice',   name:'Glow rice',  era:10, grow:90,  value:900000,    color:'#5ff0e0', stem:'#2f9a8a', h:.9},
    {id:'moonberry',  name:'Moonberry',  era:11, grow:100, value:8000000,   color:'#c06bff', stem:'#38d6c0', h:1.2},
    {id:'starbloom',  name:'Starbloom',  era:12, grow:120, value:100000000, color:'#ffd1f0', stem:'#9a7cff', h:1.5}
  ];
  const cellsIn = r => { let n = 0; const m = Math.ceil(r); for (let a = -m; a <= m; a++) for (let b = -m; b <= m; b++) if (a*a + b*b <= r*r) n++; return n; };
  const x = v => '×' + String(v);
  const T = (name, era, v, w, rig) => ({name, era, v, w, rig, cost:0});
  // Six upgrade tracks. Tier 0 is what you start with. v is the value the track gives,
  // w is how dear the tier is within its age, rig is the 3D model the tool shows.
  const TRACKS = [
    {id:'tool', label:'Tool', say:v => cellsIn(v).toLocaleString('en-US') + (cellsIn(v) === 1 ? ' plot' : ' plots') + ' per swing', tiers:[
      T('Bare hands',        1, .6,  0,   'hands'),
      T('Digging stick',     1, 1,   .15, 'stick'),
      T('Iron sickle',       1, 1.5, 3.5, 'sickle'),
      T('Ox and ard',        2, 2.1, 3.5, 'ox'),
      T('Heavy plough',      3, 2.6, 3.5, 'oxteam'),
      T('Horse plough',      4, 3.3, 3.5, 'horses'),
      T('Steam engine',      5, 4.1, 3.5, 'steam'),
      T('Tractor',           6, 5.2, 3.5, 'tractor'),
      T('Combine harvester', 7, 6.5, 3.5, 'combine'),
      T('GPS tractor',       8, 8,   3.5, 'gps'),
      T('Drone swarm',       9, 9.5, 3.5, 'drones'),
      T('Field robots',      10, 11, 3.5, 'robots'),
      T('Hover harvester',   11, 13, 3.5, 'hover'),
      T('Nanobot cloud',     12, 15, 3.5, 'cloud')]},
    {id:'pace', label:'Swing speed', say:v => v + ' swings a second', tiers:[
      T('Your own pace', 1, 2, 0), T('Whetstone', 1, 2.4, 1.7), T('Iron fittings', 2, 2.8, 1.7), T('Guild blades', 3, 3.2, 1.7),
      T('Steel edge', 4, 3.7, 1.7), T('Flywheel', 5, 4.2, 1.7), T('Power take-off', 6, 4.8, 1.7), T('Hydraulics', 7, 5.5, 1.7),
      T('Auto-steer', 8, 6.2, 1.7), T('Machine vision', 9, 7, 1.7), T('Servo arms', 10, 8, 1.7), T('Field processors', 11, 9, 1.7),
      T('Thought control', 12, 10, 1.7)]},
    {id:'legs', label:'Getting around', say:v => v + ' metres a second', tiers:[
      T('On foot', 1, 3.5, 0), T('Sandals', 1, 4, 2.6), T('Leather boots', 2, 4.5, 2.6), T('Pony', 3, 5.2, 2.6),
      T('Saddle horse', 4, 6, 2.6), T('Steam wagon', 5, 7, 2.6), T('Jeep', 6, 8.2, 2.6), T('Pickup truck', 7, 9.5, 2.6),
      T('Quad bike', 8, 11, 2.6), T('Electric buggy', 9, 12.5, 2.6), T('Maglev skids', 10, 14, 2.6), T('Hover skiff', 11, 16, 2.6),
      T('Blink drive', 12, 18, 2.6)]},
    {id:'yield', label:'Harvest', say:v => 'harvests pay ' + x(v), tiers:[
      T('By hand', 1, 1, 0), T('Threshing floor', 1, 1.3, 1.3), T('Flail', 2, 1.6, 1.3), T('Windmill', 3, 2, 1.3),
      T('Scythe', 4, 2.5, 1.3), T('Threshing machine', 5, 3.2, 1.3), T('Grain elevator', 6, 4, 1.3), T('Grain header', 7, 5, 1.3),
      T('Yield mapping', 8, 6.2, 1.3), T('Sorting AI', 9, 7.5, 1.3), T('Gene lab', 10, 9, 1.3), T('Matter printer', 11, 11, 1.3),
      T('Replicator', 12, 14, 1.3)]},
    {id:'water', label:'Water', say:v => 'crops grow ' + x(v) + ' as fast', tiers:[
      T('Rain', 1, 1, 0), T('Clay jars', 1, 1.2, 2.1), T('Well', 2, 1.4, 2.1), T('Mill pond', 3, 1.6, 2.1),
      T('Irrigation ditch', 4, 1.9, 2.1), T('Steam pump', 5, 2.2, 2.1), T('Fertilizer', 6, 2.6, 2.1), T('Pivot sprinklers', 7, 3, 2.1),
      T('Drip lines', 8, 3.5, 2.1), T('Soil sensors', 9, 4, 2.1), T('Grow lamps', 10, 4.6, 2.1), T('Weather control', 11, 5.3, 2.1),
      T('Time fields', 12, 6, 2.1)]},
    {id:'bag', label:'Bag', say:v => 'holds ' + v.toLocaleString('en-US') + ' crops', tiers:[
      T('Your pockets', 1, 15, 0), T('Linen sack', 1, 40, 1), T('Wicker basket', 2, 90, 1), T('Ox cart', 3, 200, 1),
      T('Hay wagon', 4, 450, 1), T('Grain wagon', 5, 1000, 1), T('Farm trailer', 6, 2500, 1), T('Grain truck', 7, 6000, 1),
      T('Road train', 8, 15000, 1), T('Drone hauler', 9, 40000, 1), T('Robot convoy', 10, 100000, 1), T('Cargo shuttle', 11, 250000, 1),
      T('Matter stream', 12, 700000, 1)]}
  ];
  // Price level of each age, tuned by simulation so that a fast player needs about three hours.
  const M = [/*M*/146,1640,11200,135000,1380000,12500000,153000000,1440000000,12600000000,138000000000,2100000000000,30800000000000/*M*/];
  const ERA_W = 12;
  const nice = n => { if (n < 10) return Math.max(1, Math.round(n)); const p = Math.pow(10, Math.floor(Math.log10(n)) - 1); return Math.round(n / p) * p; };
  function reprice(m){
    ERAS.forEach((e, i) => { e.cost = i ? nice(m[i - 1] * ERA_W) : 0; });
    for (const t of TRACKS) for (const tier of t.tiers) tier.cost = tier.w ? nice(m[tier.era - 1] * tier.w) : 0;
  }
  reprice(M);

  // Barns stand just outside the fence, one in the middle of each side. Empty your bag near one.
  const BARNS = [[N / 2, -6], [N / 2, N + 6], [-6, N / 2], [N + 6, N / 2]], SELL_RANGE = 9;
  function nearestBarn(x, z){
    let best = null, bd = Infinity;
    for (const b of BARNS){ const d = Math.hypot(b[0] - x, b[1] - z); if (d < bd){ bd = d; best = b; } }
    return {barn:best, dist:bd};
  }
  const cropById = Object.fromEntries(CROPS.map(c => [c.id, c]));
  const trackById = Object.fromEntries(TRACKS.map(t => [t.id, t]));
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const offsetCache = {};
  function offsets(r){
    if (offsetCache[r]) return offsetCache[r];
    const out = [], m = Math.ceil(r);
    for (let a = -m; a <= m; a++) for (let b = -m; b <= m; b++) if (a*a + b*b <= r*r) out.push(a, b);
    return offsetCache[r] = out;
  }

  function fresh(){
    const lv = {}; for (const t of TRACKS) lv[t.id] = 0;
    return {v:4, coins:0, earned:0, era:1, seed:'wheat', lv, bag:0, bagValue:0, sold:0, harvests:0, sown:0, worked:0, growing:0, clock:0, done:false,
      px:N / 2 + .5, pz:3.5, yaw:Math.PI, pitch:-.32, work:true};
  }
  function freshField(){
    return {st:new Uint8Array(N * N), crop:new Uint8Array(N * N), ever:new Uint8Array(N * N), ripe:new Float64Array(N * N)};
  }
  function rates(S){
    const r = {};
    for (const t of TRACKS) r[t.id] = t.tiers[S.lv[t.id]].v;
    return r;
  }
  const harvestValue = (crop, r) => Math.round(crop.value * r.yield);
  const growSeconds = (crop, r) => crop.grow / r.water;

  // One swing of the tool centred on plot (ci, cj). Every plot under it moves one step on:
  // grass is plowed, plowed soil is sown, a ripe crop goes into the bag. Plowing and sowing pay
  // nothing; the bag pays when you empty it at a barn. A full bag leaves ripe crops standing.
  function swing(S, F, ci, cj, r, changed){
    r = r || rates(S);
    const off = offsets(r.tool), seedIdx = CROPS.indexOf(cropById[S.seed]);
    const ripeAt = S.clock + growSeconds(CROPS[seedIdx], r);
    let got = 0, value = 0, n = 0, blocked = 0;
    for (let o = 0; o < off.length; o += 2){
      const i = ci + off[o], j = cj + off[o + 1];
      if (i < 0 || j < 0 || i >= N || j >= N) continue;
      const k = j * N + i, st = F.st[k];
      if (st === WILD){
        F.st[k] = PLOWED;
        if (!F.ever[k]){ F.ever[k] = 1; S.worked++; }
      } else if (st === PLOWED){
        F.st[k] = GROWING; F.crop[k] = seedIdx; F.ripe[k] = ripeAt; S.growing++; S.sown++;
      } else if (st === RIPE){
        if (S.bag >= r.bag){ blocked++; continue; }
        F.st[k] = WILD; S.bag++; got++; value += harvestValue(CROPS[F.crop[k]], r); S.harvests++;
      } else continue;
      n++; if (changed) changed.push(k);
    }
    S.bagValue += value;
    return {got, value, n, blocked};
  }
  function canSell(S){ return S.bag > 0 && nearestBarn(S.px, S.pz).dist <= SELL_RANGE; }
  function sell(S){
    if (!S.bag) return 0;
    const v = S.bagValue;
    S.coins += v; S.earned += v; S.sold += S.bag; S.bag = 0; S.bagValue = 0;
    return v;
  }
  function ripen(S, F, changed){
    if (!S.growing) return 0;
    let n = 0; const st = F.st, ripe = F.ripe, now = S.clock;
    for (let k = 0; k < st.length; k++) if (st[k] === GROWING && ripe[k] <= now){
      st[k] = RIPE; n++; if (changed) changed.push(k);
    }
    S.growing -= n;
    return n;
  }

  function nextTier(S, id){ const t = trackById[id]; return t.tiers[S.lv[id] + 1] || null; }
  function buy(S, id){
    const n = nextTier(S, id);
    if (!n || n.era > S.era || S.coins < n.cost) return false;
    S.coins -= n.cost; S.lv[id]++; return true;
  }
  function nextEra(S){ return ERAS[S.era] || null; }
  function advance(S){
    const n = nextEra(S);
    if (!n || S.coins < n.cost) return false;
    S.coins -= n.cost; S.era = n.id;
    const first = CROPS.find(c => c.era === n.id);
    if (first) S.seed = first.id;
    return true;
  }
  function setSeed(S, id){
    const c = cropById[id];
    if (!c || c.era > S.era) return false;
    S.seed = id; return true;
  }

  // Saving. The field is run-length encoded; crops still growing are saved as ripe.
  function pack(S, F){
    const runs = []; let prev = -1, len = 0;
    for (let k = 0; k < N * N; k++){
      const st = F.st[k] === GROWING ? RIPE : F.st[k];
      const v = st | (st === RIPE ? F.crop[k] << 2 : 0) | (F.ever[k] << 6);
      if (v === prev) len++; else { if (len) runs.push(prev, len); prev = v; len = 1; }
    }
    runs.push(prev, len);
    const s = Object.assign({}, S, {lv:Object.assign({}, S.lv), growing:0});
    return {v:4, s, field:runs};
  }
  function unpack(d){
    const S = fresh(), F = freshField();
    if (!d || (d.v !== 3 && d.v !== 4) || !d.s || !Array.isArray(d.field)) return {S, F};
    const s = d.s;
    S.coins = Math.max(0, +s.coins || 0);
    S.earned = Math.max(S.coins, +s.earned || 0);
    S.era = clamp(s.era | 0, 1, ERAS.length);
    S.harvests = Math.max(0, +s.harvests || 0);

    const crops = G.CROPS.filter(c => c.era === era.id).map(c => c.name);
    const tools = [];
    for (const t of G.TRACKS) for (const tier of t.tiers) if (tier.era === era.id && tier.cost) tools.push(tier.name);
    showCard(era.year, era.name, era.blurb,
      '<li><b>New seeds:</b> ' + crops.join(', ') + '</li>' +
      '<li><b>New in the shop:</b> ' + tools.join(', ') + '</li>' +
      '<li>You are now sowing <b>' + G.cropById[S.seed].name.toLowerCase() + '</b>. Change it in the shop.</li>');
  }
  $('veilGo').addEventListener('click', () => $('veil').classList.remove('open'));
  $('resetRow').addEventListener('click', e => {
    const id = e.target.id, row = $('resetRow');
    if (id === 'reset')
      row.innerHTML = '<span>Erase this farm and go back to the year 300?</span><button class="btn" id="resetYes" type="button">Erase farm</button><button class="btn quiet" id="resetNo" type="button">Keep farming</button>';
    else if (id === 'resetYes' || id === 'resetNo'){
      row.innerHTML = '<button class="btn quiet" id="reset" type="button">Start over</button>';
      if (id === 'resetYes'){ S = G.fresh(); F = G.freshField(); R = G.rates(S); setRig(); paintAll(); applyEra(); setWork(true); paintHud(true); openShop(false); }
    }
  });

  /* ---------- HUD ---------- */
  let shownCoins = -1, shownTip = null, shownLand = -1;
  function paintHud(force){
    const c = Math.floor(S.coins);
    if (force || c !== shownCoins){
      shownCoins = c; $('coins').textContent = fmt(c);
      const next = G.nextEra(S);
      $('fill').style.setProperty('--fill', next ? Math.min(1, S.coins / next.cost).toFixed(4) : '1');
      $('toNext').textContent = next ? fmt(Math.min(S.coins, next.cost)) + ' / ' + fmt(next.cost) + ' to ' + next.year : 'The last age';
      const can = !!next && S.coins >= next.cost, en = $('enter');
      if (en.hidden === can){ en.hidden = !can; if (can) en.textContent = 'Enter ' + next.year; }
      let ping = can;
      if (!ping) for (const t of G.TRACKS){ const nx = G.nextTier(S, t.id); if (nx && nx.era <= S.era && nx.cost <= S.coins){ ping = true; break; } }
      $('shopBtn').classList.toggle('ping', ping);
      if (sheetOpen) paintShop();
    }
    if (force || S.worked !== shownLand){
      shownLand = S.worked;
      $('land').textContent = 'Farmed ' + S.worked.toLocaleString('en-US') + ' of ' + (N * N).toLocaleString('en-US') + ' plots';
      if (!S.done && S.worked >= N * N){
        S.done = true; save();
        showCard((N * N).toLocaleString('en-US'), 'Every plot farmed', 'From bare hands in the year ' + G.ERAS[0].year + ' to ' + G.TRACKS[0].tiers[S.lv.tool].name.toLowerCase() + ' in ' + G.ERAS[S.era - 1].year + ', you have worked every plot of this field: ' + fmt(S.harvests) + ' harvests and ' + fmt(S.earned) + ' coins.', '');
      }
    }
    // bag and barn
    const full = S.bag >= R.bag, nb = G.nearestBarn(S.px, S.pz), near = nb.dist <= G.SELL_RANGE;
    const bt = 'Bag <b>' + fmt(S.bag) + ' / ' + fmt(R.bag) + '</b>' + (S.bagValue ? ' · worth ' + fmt(S.bagValue) : '');
    if ($('bagText')._t !== bt){ $('bagText')._t = bt; $('bagText').innerHTML = bt; }
    $('bagFill').style.setProperty('--fill', Math.min(1, S.bag / R.bag).toFixed(3));
    $('bagBox').classList.toggle('full', full);
    const showHint = S.bag > 0 && !near;
    $('barnHint').hidden = !showHint;
    if (showHint){
      const ang = Math.atan2(nb.barn[0] - S.px, nb.barn[1] - S.pz) - Math.atan2(-Math.sin(S.yaw), -Math.cos(S.yaw));
      $('barnArrow').style.transform = 'rotate(' + (-ang) + 'rad)';
      const ht = 'Barn ' + Math.max(0, Math.round(nb.dist - G.SELL_RANGE)) + ' m';
      if ($('barnText').textContent !== ht) $('barnText').textContent = ht;
    }
    const sb = $('sell'), canSell = near && S.bag > 0;
    if (sb.hidden === canSell) sb.hidden = !canSell;
    if (canSell){ const st = 'Empty bag · +' + fmt(S.bagValue); if (sb.textContent !== st) sb.textContent = st; }

    let tip = '';
    const seed = G.cropById[S.seed].name.toLowerCase();
    if (S.sold === 0 && !canSell){
      const main = S.worked === 0 ? 'Walk into the grass. Your hands plow every plot they reach.'
        : S.sown === 0 ? 'Now go back over the plowed soil to sow ' + seed + '.'
        : S.harvests === 0 ? 'Sown. When the ' + seed + ' ripens, walk back over it. The crop goes into your bag.'
        : full ? 'Your bag is full. Follow the arrow to the red barn and empty it there for coins.'
        : 'Harvests fill your bag. Coins come only when you empty the bag at a barn.';
      tip = '<b>' + main + '</b><span>' + (S.harvests ? 'Plowing and sowing pay nothing. Bigger bags are in the shop.' : touch ? 'Left thumb walks. Drag anywhere else to look around.' : 'W A S D to walk. Drag with the mouse to look. Space rests. E empties the bag.') + '</span>';
    } else if (full && !near) tip = '<b>Bag full.</b><span>Follow the arrow to the nearest barn to empty it. Ripe crops wait for you.</span>';
    if (tip !== shownTip){ shownTip = tip; $('tip').innerHTML = tip; $('tip').hidden = !tip; }
  }
  let gainAcc = 0, gainAt = 0;
  function popGain(text, cls){
    const s = document.createElement('span');
    s.textContent = text; if (cls) s.className = cls;
    s.style.marginLeft = (Math.random() * 60 - 30) + 'px';
    $('gains').appendChild(s);
    setTimeout(() => s.remove(), 820);
  }
  function showGain(now){
    if (!gainAcc || now - gainAt < 220) return;
    gainAt = now;
    popGain('+' + fmt(gainAcc) + ' in bag', 'bagged'); gainAcc = 0;
  }

  /* ---------- input ---------- */
  const keys = {}, look = new Map(), joy = {id:null, x:0, y:0, ox:0, oy:0};
  const joyEl = $('joy'), knob = joyEl.firstElementChild;
  if (!touch) joyEl.hidden = true;
  function setWork(on){
    S.work = on; const b = $('work');
    b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Work: on' : 'Work: off';
  }
  $('work').addEventListener('click', () => setWork(!S.work));
  canvas.addEventListener('pointerdown', e => {
    if (sheetOpen) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (e.pointerType !== 'mouse' && joy.id === null && e.clientX < w * .5 && e.clientY > h * .35){
      joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
      joyEl.classList.remove('rest'); joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px';
      knob.style.transform = '';
    } else look.set(e.pointerId, {x:e.clientX, y:e.clientY});
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerId === joy.id){
      let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const len = Math.hypot(dx, dy), max = 46;
      if (len > max){ dx *= max / len; dy *= max / len; }
      joy.x = dx / max; joy.y = dy / max;
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    } else if (look.has(e.pointerId)){
      const p = look.get(e.pointerId), k = touch ? .0055 : .004;
      S.yaw -= (e.clientX - p.x) * k;
      S.pitch = Math.max(-1.2, Math.min(.45, S.pitch - (e.clientY - p.y) * k));
      p.x = e.clientX; p.y = e.clientY;
    }
  });
  function release(e){
    if (e.pointerId === joy.id){
      joy.id = null; joy.x = joy.y = 0; knob.style.transform = '';
      joyEl.classList.add('rest'); joyEl.style.left = ''; joyEl.style.top = '';
    }
    look.delete(e.pointerId);
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !sheetOpen && !e.repeat && document.activeElement.tagName !== 'BUTTON'){ setWork(!S.work); e.preventDefault(); }
    if (e.code === 'Escape' && sheetOpen) openShop(false);
    if (e.code === 'KeyE' && !sheetOpen) emptyBag();
    keys[e.code] = true;
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  /* ---------- loop ---------- */
  const changed = [];
  let last = 0, swingT = 0, ripenT = 0, cropT = 0, hudT = 0, saveT = 0, kick = 0, eye = 1.8, tci = 0, tcj = 0, cropsDirty = true;
  function frame(ts){
    requestAnimationFrame(frame);
    const dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts;
    S.clock += dt;
    const busy = sheetOpen || $('veil').classList.contains('open');
    const sin = Math.sin(S.yaw), cos = Math.cos(S.yaw);

    // walk
    let moved = 0;
    if (!busy){
      let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
      let s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
      const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
      if (turn) S.yaw += turn * 1.8 * dt;
      const len = Math.hypot(f, s);
      if (len > 1){ f /= len; s /= len; }
      if (len > .05){
        const v = R.legs * dt, ox = S.px, oz = S.pz;
        S.px = Math.max(.5, Math.min(N - .5, S.px + (-sin * f + cos * s) * v));
        S.pz = Math.max(.5, Math.min(N - .5, S.pz + (-cos * f - sin * s) * v));
        moved = (S.px - ox) * -sin + (S.pz - oz) * -cos;
        if (Math.abs(moved) < 1e-4) moved = Math.hypot(S.px - ox, S.pz - oz);
      }
    }
    // where the tool works
    const d = Math.max(R.tool * .6 + 1.2, rig.minDist || 0);
    const tx = S.px - sin * d, tz = S.pz - cos * d;
    tci = Math.max(0, Math.min(N - 1, Math.floor(tx)));
    tcj = Math.max(0, Math.min(N - 1, Math.floor(tz)));
    // swing
    swingT += dt * R.pace;
    if (swingT >= 1){
      if (S.work && !busy){
        const res = G.swing(S, F, tci, tcj, R, changed);
        if (res.n){ swingT -= 1; gainAcc += res.got; kick = 1; burst(tci, tcj, res); } else swingT = 1;
      } else swingT = 1;
    }
    ripenT += dt;
    if (ripenT > .25){ ripenT = 0; G.ripen(S, F, changed); }
    if (changed.length){
      for (let a = 0; a < changed.length; a++) paintCell(changed[a]);
      changed.length = 0; tex.needsUpdate = true; mapDirty = true; cropsDirty = true;
    }
    cropT += dt;
    if (cropsDirty || cropT > .15){ cropT = 0; cropsDirty = false; updateCrops(); }

    // camera, tool and ring
    kick = Math.max(0, kick - dt * 5);
    eye += (Math.max(1.6 + .28 * R.tool, rig.eye || 0) - eye) * Math.min(1, dt * 3);
    camera.position.set(S.px, eye, S.pz);
    camera.rotation.set(S.pitch, S.yaw, 0);
    if (!rig.view){ rig.group.position.set(tx, 0, tz); rig.group.rotation.y = S.yaw; }
    rig.tick(dt, moved, kick);
    const rr = Math.max(R.tool, .62);
    reach.position.set(tci + .5, .06, tcj + .5); reach.scale.set(rr, rr, 1);
    ringMat.opacity = S.work ? .5 : .2;
    if (stars.visible) stars.position.copy(camera.position);
    sky.position.copy(camera.position);
    wind.value += dt;
    updateFlies(dt);
    if (dust.visible){ dust.position.set(S.px, 0, S.pz); dust.rotation.y += dt * .03; }
    for (const c of clouds){ c.position.x += c.userData.v * dt; if (c.position.x > N / 2 + 700) c.position.x -= 1400; }
    sun.target.position.set(Math.round(tx * .5 + S.px * .5), 0, Math.round(tz * .5 + S.pz * .5));
    sun.position.copy(sun.target.position).addScaledVector(sunDir, 120);
    renderer.render(scene, camera);

    showGain(ts);
    hudT += dt;
    if (hudT > .12){ hudT = 0; paintHud(false); paintMap(); }
    saveT += dt;
    if (saveT > 8){ saveT = 0; save(); }
  }

  function start(data){
    const got = G.unpack(data && data.v ? data : readLocal());
    S = got.S; F = got.F; R = G.rates(S);
    setGfx(gfx); setRig(); paintAll(); applyEra(); setWork(S.work); resize(); paintHud(true); paintMap();
    started = true;
    requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(() => G.pack(S, F));
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
