<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Realistic Furrows of Time</title>
<style>
body { margin:0; overflow:hidden; font-family: system-ui, sans-serif; background:#87CEEB; color:#fff; }
#hud { position:absolute; top:12px; left:12px; background:rgba(0,0,0,.55); padding:10px 14px; border-radius:10px; font-size:14px; pointer-events:none; min-width:220px; z-index:2; }
#hud div { margin:2px 0; }
#hint { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.5); padding:6px 12px; border-radius:20px; font-size:13px; z-index:2; }
canvas { display:block; position:fixed; inset:0; }
</style>
</head>
<body>
<div id="hud">
  <div><b>Realistic Furrows of Time</b></div>
  <div>Year: <span id="year">300</span> · <span id="age">Antiquity</span></div>
  <div>Coins: <span id="coins">0</span></div>
  <div>Bag: <span id="bag">0</span> / <span id="bagMax">15</span></div>
  <div>Plots farmed: <span id="worked">0</span></div>
</div>
<div id="hint">Click to lock mouse · WASD move · Space work · Esc unlock</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const N = 48;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(0x87CEEB, 0x5a4a32, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff8e7, 1.35);
sun.position.set(40, 60, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 150;
sun.shadow.camera.left = sun.shadow.camera.bottom = -40;
sun.shadow.camera.right = sun.shadow.camera.top = 40;
scene.add(sun);

const geo = new THREE.PlaneGeometry(N, N, N-1, N-1);
geo.rotateX(-Math.PI/2);
const mat = new THREE.MeshStandardMaterial({
  color: 0x6b5436, roughness: 0.92, metalness: 0.02
});
const terrain = new THREE.Mesh(geo, mat);
terrain.receiveShadow = true;
terrain.position.set(N/2, 0, N/2);
scene.add(terrain);

const cropMat = new THREE.MeshStandardMaterial({color:0x8fbc3f, roughness:0.7});
const stemGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.6, 5);
const headGeo = new THREE.SphereGeometry(0.12, 6, 5);
const crops = new THREE.Group();
scene.add(crops);

let field = new Uint8Array(N*N);
let coins = 0, bag = 0, bagMax = 20, worked = 0, era = 1;
const eras = [
  {year:300, name:'Antiquity'}, {year:800, name:'Early Medieval'},
  {year:1200, name:'High Medieval'}, {year:1600, name:'Discovery'}
];

function updateTerrain() {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = i % N, z = Math.floor(i / N);
    const idx = z * N + x;
    let h = 0.04 * Math.sin(x*0.4) * Math.cos(z*0.35);
    if (field[idx] >= 1) h = -0.18 + Math.sin(x*1.2)*0.02;
    pos.setY(i, h);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

function updateCrops() {
  while (crops.children.length) crops.remove(crops.children[0]);
  for (let i = 0; i < N*N; i++) {
    if (field[i] < 2) continue;
    const x = (i % N) + 0.5, z = Math.floor(i / N) + 0.5;
    const g = new THREE.Group();
    const stem = new THREE.Mesh(stemGeo, cropMat);
    stem.position.y = 0.3;
    stem.castShadow = true;
    g.add(stem);
    if (field[i] === 3) {
      const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({color:0xf0d060}));
      head.position.y = 0.7;
      head.castShadow = true;
      g.add(head);
    }
    g.position.set(x, 0, z);
    g.scale.y = field[i] === 3 ? 1.4 : 0.7 + Math.random()*0.3;
    crops.add(g);
  }
}

function swing() {
  const dx = -Math.sin(yaw), dz = -Math.cos(yaw);
  const tx = Math.floor(camera.position.x + dx * 2.2);
  const tz = Math.floor(camera.position.z + dz * 2.2);
  if (tx < 0 || tz < 0 || tx >= N || tz >= N) return;
  const idx = tz * N + tx;
  if (!working) return;
  if (field[idx] === 0) { field[idx] = 1; worked++; }
  else if (field[idx] === 1) field[idx] = 2;
  else if (field[idx] === 3 && bag < bagMax) { field[idx] = 0; bag++; coins += 8 + era*3; }
  updateTerrain(); updateCrops();
  updateHud();
}

function updateHud() {
  document.getElementById('year').textContent = eras[era-1].year;
  document.getElementById('age').textContent = eras[era-1].name;
  document.getElementById('coins').textContent = coins;
  document.getElementById('bag').textContent = bag;
  document.getElementById('bagMax').textContent = bagMax;
  document.getElementById('worked').textContent = worked;
  if (coins >= 200 && era < eras.length) { era++; bagMax += 10; }
}

const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') working = !working; });
document.addEventListener('keyup', e => keys[e.code] = false);
let working = true, yaw = Math.PI, pitch = -0.35;
let locked = false;
renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => locked = document.pointerLockElement === renderer.domElement);
document.addEventListener('mousemove', e => {
  if (!locked) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.3, Math.min(0.5, pitch));
});

let last = performance.now();
function animate(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const speed = 5.5 * dt;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  if (keys.KeyW) { camera.position.x -= sin*speed; camera.position.z -= cos*speed; }
  if (keys.KeyS) { camera.position.x += sin*speed; camera.position.z += cos*speed; }
  if (keys.KeyA) { camera.position.x -= cos*speed; camera.position.z += sin*speed; }
  if (keys.KeyD) { camera.position.x += cos*speed; camera.position.z -= sin*speed; }
  camera.position.x = Math.max(0.5, Math.min(N-0.5, camera.position.x));
  camera.position.z = Math.max(0.5, Math.min(N-0.5, camera.position.z));
  camera.position.y = 1.65;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if (working && Math.random() < dt * 4) swing();
  for (let i = 0; i < N*N; i++) if (field[i] === 2 && Math.random() < dt * 0.15) field[i] = 3;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
updateTerrain(); updateCrops(); updateHud();
camera.position.set(N/2, 1.65, N - 4);
requestAnimationFrame(animate);
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
