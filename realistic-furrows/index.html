<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realistic Furrows of Time</title>
<style>
body { margin:0; overflow:hidden; font-family:system-ui; background:#87CEEB; }
#hud { position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,.5); padding:10px; border-radius:8px; }
canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <div>Coins: <span id="coins">0</span></div>
  <div>Age: <span id="age">Antiquity (300)</span></div>
  <div>Bag: <span id="bag">0</span></div>
  <div>Press Space to work | WASD move | Mouse look</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Simplified realistic farming game based on Furrows of Time concept
const N = 32; // smaller for realism/performance
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5e6, 1.2);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
scene.add(sun);

// Terrain
const geo = new THREE.PlaneGeometry(N, N, N-1, N-1);
geo.rotateX(-Math.PI/2);
const mat = new THREE.MeshStandardMaterial({color:0x5a4a32, roughness:0.9, metalness:0.0});
const terrain = new THREE.Mesh(geo, mat);
terrain.receiveShadow = true;
terrain.position.set(N/2, 0, N/2);
scene.add(terrain);

// Player
camera.position.set(N/2, 1.7, 2);
let yaw = 0, pitch = 0;

// Simple field state
const field = new Uint8Array(N*N); // 0=grass, 1=plowed, 2=growing, 3=ripe
let coins = 0, bag = 0, era = 1;

// Controls
const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);
let working = false;
document.addEventListener('keydown', e => { if (e.code === 'Space') working = !working; });

// Mouse look
let isPointerLocked = false;
renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => isPointerLocked = document.pointerLockElement === renderer.domElement);
document.addEventListener('mousemove', e => {
  if (!isPointerLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.2, Math.min(0.4, pitch));
});

function updateTerrain() {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = Math.floor(i % N);
    const z = Math.floor(i / N);
    const idx = z * N + x;
    let h = 0;
    if (field[idx] >= 1) h = -0.15; // furrow
    if (field[idx] === 0) h = 0.02 * Math.sin(x*0.5) * Math.cos(z*0.5); // slight grass variation
    pos.setY(i, h);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

// Crops (simple spheres for now, can be improved)
const cropGeo = new THREE.SphereGeometry(0.15, 6, 6);
const cropMat = new THREE.MeshStandardMaterial({color:0x4a8f2a});
const crops = new THREE.InstancedMesh(cropGeo, cropMat, N*N);
crops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(crops);

function updateCrops() {
  const dummy = new THREE.Object3D();
  let count = 0;
  for (let i = 0; i < N*N; i++) {
    if (field[i] >= 2) {
      const x = (i % N) + 0.5;
      const z = Math.floor(i / N) + 0.5;
      dummy.position.set(x, 0.3, z);
      dummy.scale.set(1, field[i] === 3 ? 1.5 : 0.8, 1);
      dummy.updateMatrix();
      crops.setMatrixAt(count++, dummy.matrix);
    }
  }
  crops.count = count;
  crops.instanceMatrix.needsUpdate = true;
}

function swing() {
  // Simple: plow/sow/harvest in front
  const dx = -Math.sin(yaw);
  const dz = -Math.cos(yaw);
  const tx = Math.floor(camera.position.x + dx * 2);
  const tz = Math.floor(camera.position.z + dz * 2);
  if (tx >= 0 && tz >= 0 && tx < N && tz < N) {
    const idx = tz * N + tx;
    if (working) {
      if (field[idx] === 0) field[idx] = 1;
      else if (field[idx] === 1) field[idx] = 2;
      else if (field[idx] === 3) { field[idx] = 0; bag++; coins += 5; }
    }
  }
  updateTerrain();
  updateCrops();
}

let last = performance.now();
function animate(now) {
  const dt = (now - last) / 1000;
  last = now;

  // Movement
  const speed = 4 * dt;
  if (keys['KeyW']) {
    camera.position.x += -Math.sin(yaw) * speed;
    camera.position.z += -Math.cos(yaw) * speed;
  }
  if (keys['KeyS']) {
    camera.position.x -= -Math.sin(yaw) * speed;
    camera.position.z -= -Math.cos(yaw) * speed;
  }
  if (keys['KeyA']) {
    camera.position.x += -Math.cos(yaw) * speed;
    camera.position.z += Math.sin(yaw) * speed;
  }
  if (keys['KeyD']) {
    camera.position.x -= -Math.cos(yaw) * speed;
    camera.position.z -= Math.sin(yaw) * speed;
  }
  camera.position.x = Math.max(0.5, Math.min(N-0.5, camera.position.x));
  camera.position.z = Math.max(0.5, Math.min(N-0.5, camera.position.z));
  camera.position.y = 1.7;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if (working && Math.random() < dt * 3) swing();

  // Simple growth
  for (let i = 0; i < N*N; i++) if (field[i] === 2 && Math.random() < dt * 0.1) field[i] = 3;

  document.getElementById('coins').textContent = coins;
  document.getElementById('bag').textContent = bag;
  document.getElementById('age').textContent = 'Antiquity (300)';

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
updateTerrain();
updateCrops();
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
